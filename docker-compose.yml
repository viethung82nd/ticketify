# Local development infrastructure. Credentials here are dev-only defaults.
# Values for object storage are read from the repo-root .env (see .env.example).
name: ticketify

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ticketify
      POSTGRES_PASSWORD: ticketify
      POSTGRES_DB: ticketify
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketify -d ticketify']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (RustFS). Official MinIO images are no longer published.
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-ticketify}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-ticketify-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot job: creates the bucket if missing and sets its CORS rule, then exits 0.
  # Its exit code is its health signal (no long-running healthcheck needed).
  # CORS lets the browser PUT posters straight to presigned URLs (task 1.6).
  s3-init:
    image: rustfs/rustfs:1.0.4
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ticketify}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ticketify-secret}
      S3_BUCKET: ${S3_BUCKET:-ticketify}
      S3_REGION: ${S3_REGION:-us-east-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    entrypoint: ['sh', '-ec']
    command:
      - |
        url="http://s3:9000/$${S3_BUCKET}"
        sign="aws:amz:$${S3_REGION}:s3"
        if curl -fs -o /dev/null --aws-sigv4 "$$sign" --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY" -I "$$url"; then
          echo "bucket $${S3_BUCKET} already exists"
        else
          curl -fsS --aws-sigv4 "$$sign" --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY" -X PUT "$$url"
          echo "bucket $${S3_BUCKET} created"
        fi
        origins=""
        for origin in $$(echo "$$CORS_ORIGINS" | tr ',' ' '); do
          origins="$$origins<AllowedOrigin>$$origin</AllowedOrigin>"
        done
        cors="<CORSConfiguration><CORSRule>$$origins<AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedHeader>*</AllowedHeader><MaxAgeSeconds>600</MaxAgeSeconds></CORSRule></CORSConfiguration>"
        md5=$$(printf '%s' "$$cors" | md5sum | cut -d' ' -f1 | xxd -r -p | base64)
        curl -fsS --aws-sigv4 "$$sign" --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY" -X PUT \
          -H "Content-MD5: $$md5" -H 'Content-Type: application/xml' --data "$$cors" "$$url?cors"
        echo "bucket $${S3_BUCKET} CORS allows $$CORS_ORIGINS"
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  s3-data:
