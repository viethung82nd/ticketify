name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Per PR (pull_request.number) or per branch/tag (github.ref): two different PRs never share a
  # group, so they cannot cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new commit on a PR cancels that PR's stale run. A push to main, a schedule or a manual run is
  # never cancelled: every commit on main keeps its own validation, and a second merge queues behind
  # the first instead of killing it. Cancelling a PR run is safe here because lint, typecheck and
  # the unit and integration tests touch nothing outside the runner.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Also builds packages/shared (prepare) and generates the Prisma client (postinstall).
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      # Postgres + Redis via Testcontainers (Docker is available on ubuntu-latest).
      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  # The commit-msg hook can be skipped locally; this checks every commit of the PR again.
  # Only the PR's own commits (base..head), never the whole history: older commits on main
  # stay as they are (no rewrite).
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --ignore-scripts: commitlint needs the root devDependencies only, not the Prisma client
      # (apps/api postinstall) or packages/shared/dist (prepare). No test runs in this job.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
