name: Worker shutdown (Linux)

# Real SIGTERM against the real worker process (worker-shutdown.int-spec.ts, ROADMAP 2.6).
# The suite is opt-in (RUN_SIGNAL_TESTS=1); only this workflow turns it on.
on:
  pull_request:
    paths:
      - 'apps/api/src/modules/bookings/**'
      - 'apps/api/src/infra/queue/**'
      - 'apps/api/src/main.worker.ts'
      - 'apps/api/test/integration/worker-shutdown.int-spec.ts'
      - 'apps/api/test/support/worker-preload/**'
      - '.github/workflows/worker-shutdown.yml'
  # The same paths as the PR trigger: a merge commit is re-validated only when it actually carries
  # a change to the worker or the queue. CI still runs on every push to main, filtered by nothing.
  push:
    branches: [main]
    paths:
      - 'apps/api/src/modules/bookings/**'
      - 'apps/api/src/infra/queue/**'
      - 'apps/api/src/main.worker.ts'
      - 'apps/api/test/integration/worker-shutdown.int-spec.ts'
      - 'apps/api/test/support/worker-preload/**'
      - '.github/workflows/worker-shutdown.yml'
  # Weekly, for regressions from changes outside the paths above (Monday 02:00 UTC).
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  # Per PR (pull_request.number) or per branch/tag (github.ref): two different PRs never share a
  # group, so they cannot cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new commit on a PR cancels that PR's stale run. A push to main, a schedule or a manual run is
  # never cancelled: every commit on main keeps its own validation, and a second merge queues behind
  # the first instead of killing it. Cancelling a PR run is safe here because the suite sends
  # SIGTERM only to its own child process and talks only to this job's own Postgres and Redis
  # containers.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  worker-shutdown:
    name: worker shutdown on SIGTERM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_SIGNAL_TESTS: '1'
      # Service containers below instead of Testcontainers. No storage: the suite never calls S3.
      TEST_DATABASE_URL: postgresql://ticketify:ticketify@localhost:5432/ticketify
      TEST_REDIS_URL: redis://localhost:6379
    # Same images as docker-compose.yml and test/support/test-env.ts.
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ticketify
          POSTGRES_PASSWORD: ticketify
          POSTGRES_DB: ticketify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Also builds packages/shared (prepare) and generates the Prisma client (postinstall).
      - name: Install
        run: pnpm install --frozen-lockfile

      # No build step: the suite compiles the worker itself (tsc -p tsconfig.build.json --outDir
      # dist/.worker-shutdown) from the current sources, and packages/shared/dist already exists
      # from install (prepare). Nothing here reads apps/api/dist or apps/web/dist, so `pnpm build`
      # only repeated CI's work — including a full Vite build of the React app.
      - name: Worker shutdown test
        run: pnpm --filter @ticketify/api test:integration -- worker-shutdown

      - name: Upload worker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-shutdown-logs
          path: artifacts/worker-shutdown/
          if-no-files-found: ignore
          # Kept on a green run too (the log is the evidence the shutdown was clean), but it is a
          # debugging reference, not an archive.
          retention-days: 14
